name: Publish

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Name of the release (defaults to the tag)"
        required: false
        type: string
      prerelease:
        description: "Is this a prerelease?"
        required: false
        default: true
        type: boolean
      publish_testpypi:
        description: "Publish to TestPyPI instead of PyPI"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Build everything but do not publish"
        required: false
        default: true
        type: boolean

  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'Livia/**'

jobs:
  version:
    name: Calculate Version
    runs-on: windows-2025-vs2026

    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      revision: ${{ steps.version.outputs.revision }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Calculate version
        id: version
        shell: pwsh
        run: |
          .\.github\scripts\Get-LiviaVersion.ps1

  nuget:
    name: Publish to NuGet
    needs: version

    uses: ./.github/workflows/publish-nuget.yml

    permissions:
      id-token: write
      contents: write

    with:
      version: ${{ needs.version.outputs.version }}
      build: ${{ needs.version.outputs.build }}
      revision: ${{ needs.version.outputs.revision }}
      release_name: ${{ inputs.release_name }}
      prerelease: ${{ inputs.prerelease }}
      dry_run: ${{ inputs.dry_run }}

    secrets: inherit

  pypi-build:
    name: Build Python Package
    needs: version
    runs-on: windows-2025-vs2026

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build Python package
        shell: pwsh
        run: |
          .\Python\build-package.ps1 `
            -Python "python" `
            -Version "${{ needs.version.outputs.version }}" `
            -Build ${{ needs.version.outputs.build }} `
            -Revision ${{ needs.version.outputs.revision }}

      - name: Upload Python distribution
        uses: actions/upload-artifact@v7
        with:
          name: livia-python-dist-${{ needs.version.outputs.version }}
          path: Python/dist/*.whl
          retention-days: 7

  pypi:
    name: Publish to PyPI
    needs:
      - version
      - pypi-build

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: pypi

    steps:
      - name: Download Python distribution
        uses: actions/download-artifact@v8
        with:
          name: livia-python-dist-${{ needs.version.outputs.version }}
          path: dist/

      - name: Publish to TestPyPI
        if: ${{ !inputs.dry_run && inputs.publish_testpypi }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: ${{ !inputs.dry_run && !inputs.publish_testpypi }}
        uses: pypa/gh-action-pypi-publish@release/v1