name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: "Publish to TestPyPI instead of PyPI"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Build everything but do not publish"
        required: false
        default: true
        type: boolean

  workflow_call:
    inputs:
      publish_testpypi:
        required: false
        type: boolean
        default: false
      dry_run:
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: Build Python Package
    runs-on: windows-2025-vs2026

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build Python package
        shell: pwsh
        run: |
          .\Python\build-package.ps1 -Python "python"

      - name: Upload Python distribution
        uses: actions/upload-artifact@v7
        with:
          name: livia-python-dist
          path: Python/dist/*.whl
          retention-days: 7

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest

    needs:
      - build

    permissions:
      id-token: write
      contents: read

    environment:
      name: pypi

    steps:
      - name: Download Python distribution
        uses: actions/download-artifact@v8
        with:
          name: livia-python-dist
          path: dist/

      - name: Publish to TestPyPI
        if: ${{ !inputs.dry_run && inputs.publish_testpypi }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: ${{ !inputs.dry_run && !inputs.publish_testpypi }}
        uses: pypa/gh-action-pypi-publish@release/v1