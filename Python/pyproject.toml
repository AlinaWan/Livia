[build-system]
requires = [
    "setuptools>=75",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "livia-python"
dynamic = ["version"]
description = "Python bindings for the Livia .NET library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pythonnet>=3.0,<4"
]

[tool.setuptools]
packages = ["livia"]

[tool.setuptools.dynamic]
version = { attr = "livia._version.__version__" }

[tool.setuptools.package-data]
livia = [
    "Livia.dll",
    "runtimeconfig.json",
    "Native/ScreenCapture/Livia.Native.DxgiFrameCapture.dll",
]